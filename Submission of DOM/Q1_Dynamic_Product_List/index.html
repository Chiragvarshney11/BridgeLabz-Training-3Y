<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Product List Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Product List Manager</h1>
    <form id="productForm">
      <input id="productInput" type="text" placeholder="Enter product name" required>
      <button type="submit">Add Product</button>
    </form>
    <ul id="productList" aria-label="Products"></ul>
    <p id="emptyMessage">No products added yet.</p>
  </main>
</body>
</html>
