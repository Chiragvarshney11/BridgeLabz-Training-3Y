<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Image Gallery</h1>
    <div class="gallery" id="gallery">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500" alt="Mountain landscape">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=500" alt="Lake and mountains">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500" alt="Mountain lake">
      <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=500" alt="Deer in nature">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500" alt="Forest path">
      <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500" alt="Sunlit landscape">
    </div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-content" id="modalContent">
      <button class="close-button" id="closeButton" type="button" aria-label="Close">×</button>
      <img id="previewImage" src="" alt="Large preview">
    </div>
  </div>
</body>
</html>
