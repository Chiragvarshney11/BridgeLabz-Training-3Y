<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="gallery-page">
        <header>
            <p class="eyebrow">CSS ONLY</p>
            <h1>Travel Photo Gallery</h1>
            <p>Hover over an image to reveal its caption.</p>
        </header>

        <section class="gallery">
            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1015/800/600" alt="Mountain landscape">
                <figcaption>Mountain Escape</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1016/800/600" alt="Forest and river">
                <figcaption>Forest River</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1018/800/600" alt="Mountain valley">
                <figcaption>Valley View</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1025/800/600" alt="Dog portrait">
                <figcaption>Friendly Companion</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1035/800/600" alt="River landscape">
                <figcaption>Peaceful Waters</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/1043/800/600" alt="Ocean and rocks">
                <figcaption>Ocean Horizon</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
