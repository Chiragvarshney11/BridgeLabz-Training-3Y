<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height & Width Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="layout">
        <section class="size-box box-one">
            <h2>Box 1</h2>
            <p>200px × 160px</p>
        </section>

        <section class="size-box box-two">
            <h2>Box 2</h2>
            <p>40% width and 25vh height</p>
            <p>This box demonstrates max-width.</p>
        </section>

        <section class="size-box box-three">
            <h2>Box 3</h2>
            <p>12em width with min-height.</p>
            <p class="long-text">Overflow is demonstrated here with content that is intentionally longer than the available area.</p>
        </section>
    </main>
</body>
</html>
