<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Advanced CSS Selectors</h1>

        <section class="controls">
            <input type="text" placeholder="Attribute selector">
            <input type="email" placeholder="Another input">
            <a href="https://example.com">Secure HTTPS Link</a>
            <a href="http://example.com">HTTP Link</a>
        </section>

        <section class="list-section">
            <h2>Items</h2>
            <ul class="items">
                <li>First item</li>
                <li>Second item</li>
                <li>Third item</li>
                <li>Fourth item</li>
            </ul>
        </section>

        <section class="combinators">
            <h2>Combinators</h2>
            <div class="parent">
                <p>Direct child paragraph</p>
                <span>Sibling target</span>
                <span>General sibling</span>
            </div>
        </section>
    </main>
</body>
</html>
