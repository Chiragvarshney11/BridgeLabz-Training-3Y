<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows & Depth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Shadows & Depth</h1>
    </header>

    <main class="cards">
        <article class="card shadow-one">
            <h2>Soft Shadow</h2>
            <p>A subtle shadow gives the card a clean floating appearance.</p>
        </article>

        <article class="card shadow-two">
            <h2>Deep Shadow</h2>
            <p>A stronger shadow creates more visual depth.</p>
        </article>

        <article class="card shadow-three">
            <h2>Layered Shadow</h2>
            <p>Multiple shadows can create a more detailed depth effect.</p>
        </article>
    </main>
</body>
</html>
