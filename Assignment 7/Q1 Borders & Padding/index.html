<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders & Padding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Borders & Padding</h1>
        <p>Different border styles and internal spacing</p>
    </header>

    <main class="box-container">
        <section class="demo-box solid">
            <h2>Solid</h2>
            <p>Solid border with 20px padding.</p>
        </section>

        <section class="demo-box dashed">
            <h2>Dashed</h2>
            <p>Dashed border with 30px padding.</p>
        </section>

        <section class="demo-box double">
            <h2>Double</h2>
            <p>Double border with 15px padding.</p>
        </section>

        <section class="demo-box groove rounded">
            <h2>Groove</h2>
            <p>Rounded corners using border-radius.</p>
        </section>
    </main>

    <footer>
        <p>Hover over a box to see the border transition.</p>
    </footer>
</body>
</html>
